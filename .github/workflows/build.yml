name: Build Atari ST PRG

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: logronoide/atarist-toolkit-docker:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show compiler
        run: |
          which m68k-atari-mint-gcc
          m68k-atari-mint-gcc --version

      - name: Build CFGEDIT.PRG
        run: make

      - name: Upload Atari ST binary
        uses: actions/upload-artifact@v4
        with:
          name: cfgedit-atari-st
          path: CFGEDIT.PRG
